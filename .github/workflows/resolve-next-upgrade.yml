name: Resolve Next.js security upgrade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve-and-verify:
    if: github.event.pull_request.head.ref == 'fix/a1-nextjs-critical-security-20261114' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Resolve patched Next.js and lockfile
        run: npm install next@16.4.6 --save-exact --ignore-scripts

      - name: Commit resolved dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock already resolved."
          else
            git commit -m "fix(security): upgrade Next.js to 16.4.6"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Clean install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Enforce high and critical vulnerability gate
        run: npm audit --audit-level=high
