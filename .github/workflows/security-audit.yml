name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run npm audit
        run: npm audit --json > npm-audit.json || true

      - name: Print audit summary and advisories
        run: |
          node <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const v = r.metadata?.vulnerabilities || {};
          console.log("SUMMARY", JSON.stringify(v));
          for (const [key, item] of Object.entries(r.vulnerabilities || {})) {
            console.log("\nPACKAGE:", key);
            console.log("SEVERITY:", item.severity);
            console.log("RANGE:", item.range || "");
            console.log("DIRECT:", item.isDirect);
            console.log("VIA:", JSON.stringify(item.via || []));
            console.log("FIX AVAILABLE:", JSON.stringify(item.fixAvailable || false));
          }
          NODE
